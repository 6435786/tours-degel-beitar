<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>שלטים – דגל</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#dbeafe;--ok:#16a34a;--ok2:#dcfce7;--bad:#dc2626;--bad2:#fee2e2;--warn:#b45309;--warn2:#fef3c7;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--pri)}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.mute{color:var(--mute)}
.small{font-size:13px}
.top{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));min-height:48px}
.top .ttl{font-weight:700;font-size:17px;flex:1}
.top .who{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
.top button,.top select{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.top select option{color:#000}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:48px;z-index:29;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;background:none;padding:8px 13px;border-radius:999px;font:inherit;color:var(--mute);cursor:pointer}
.tab.on{background:var(--pri2);color:var(--pri);font-weight:700}
.tab .n{display:inline-block;min-width:20px;text-align:center;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:12px;margin-inline-start:5px;font-weight:700}
main{max-width:1150px;margin:0 auto;padding:12px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.grid>.card{margin:0}
.row2{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:var(--ink);font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:#fca5a5;color:var(--bad)}
.btn.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:700}
.btn.big{min-height:52px;font-size:16px;font-weight:600;width:100%}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
label.f b{color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .c{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-inline-end:5px}
.chip small{opacity:.7;margin-inline-start:4px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;background:#f1f5f9;color:var(--mute)}
.pill.crane{background:#ffedd5;color:#c2410c;font-weight:600}
.pill.ok{background:var(--ok2);color:var(--ok)}
.pill.bad{background:var(--bad2);color:var(--bad)}
.num{display:inline-block;min-width:34px;padding:1px 6px;border-radius:6px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;text-align:center}
.addr{font-weight:600}
.tel{display:inline-block;margin:2px 0 2px 6px;padding:3px 9px;border-radius:8px;background:var(--ok2);color:#166534;text-decoration:none;font-size:14px;direction:ltr}
.tel.bad{background:var(--bad2);color:var(--bad)}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ph{position:relative;width:84px;height:84px;border-radius:9px;overflow:hidden;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute)}
.ph a{display:block;width:100%;height:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-x{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.ph.up{border:2px dashed #94a3b8}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.toolbar>input{flex:2 1 200px}
.toolbar>select{flex:1 1 130px;width:auto}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kpi>div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1 1 140px}
.kpi b{display:block;font-size:19px}
.bulk{position:sticky;top:96px;z-index:15;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bulk .btn{min-height:34px;padding:4px 10px;font-size:13px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl .r{display:grid;grid-template-columns:34px 50px minmax(200px,2.4fr) minmax(130px,1.2fr) 52px 104px 92px 168px;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}
.tbl .r:hover{background:#f8fafc}
.tbl .r.sel{background:#eff6ff}
.tbl .hd{font-size:12px;color:var(--mute);font-weight:600;border-top:0;cursor:default;background:#f8fafc}
.tbl .meta{display:contents}
.tbl .cnum .city-m{display:none}
@media (max-width:899px){
  .tbl .hd{display:none}
  .tbl .r{display:flex;flex-wrap:wrap;gap:4px 8px;padding:10px}
  .tbl .r>.csel{order:0}
  .tbl .r>.cnum{order:1}
  .tbl .r>.caddr{order:2;flex:1 1 55%}
  .tbl .r>.cst{order:3;margin-inline-start:auto}
  .tbl .r>.cph{order:4;flex:1 1 100%;padding-inline-start:42px}
  .tbl .r>.meta{order:5;display:flex;gap:6px;flex:1 1 100%;padding-inline-start:42px;flex-wrap:wrap}
  .tbl .meta>div:empty{display:none}
  .tbl .meta>div{font-size:13px;background:#f1f5f9;border-radius:6px;padding:1px 8px}
  .bulk{top:96px}
  .tbl .r.hd{display:none}
  .kpi{gap:6px}
  .kpi>div{flex:1 1 40%;padding:6px 10px}
  .kpi b{font-size:17px}
}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.empty .i{font-size:34px}
.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}
.kv>span:nth-child(odd){color:var(--mute)}
.price{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.price .g{font-size:20px;font-weight:700;color:var(--ink)}
.advice{background:var(--warn2);color:#78350f;border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.advice.ok{background:var(--ok2);color:#166534}
.seg{display:flex;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px;font:inherit;cursor:pointer;min-height:44px}
.seg button+button{border-inline-start:1px solid #cbd5e1}
.seg button.on{background:var(--pri);color:#fff;font-weight:700}
.log{font-size:13px;margin:6px 0 0;padding:0;list-style:none}
.log li{padding:3px 0;border-top:1px dashed var(--line)}
.log .t{color:var(--mute);font-size:12px}
.lastlog{font-size:13px;margin-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 10px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:760px;padding:14px;position:relative}
.modal .x{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:0;background:#f1f5f9;font-size:20px;cursor:pointer}
@media (max-width:600px){.modal-bg{padding:0}.modal{border-radius:0;min-height:100vh}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--bad)}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .card{max-width:380px;width:100%;text-align:center;padding:28px 22px}
.auth h1{font-size:22px;margin:0 0 6px;color:var(--pri)}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:11px 18px;font:inherit;font-size:16px;cursor:pointer;margin-top:14px}
.err{color:var(--bad);font-size:14px;margin-top:10px}
pre.code{direction:ltr;text-align:left;background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;overflow:auto;font-size:12px;max-height:340px}
.modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mode{border:2px solid var(--line);border-radius:14px;background:#fff;padding:18px 14px;font:inherit;cursor:pointer;text-align:center}
.mode:hover{border-color:var(--pri)}
.mode .i{font-size:30px;display:block}
.mode b{display:block;font-size:16px;margin:4px 0}
.pick{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px;cursor:pointer;width:100%;font:inherit;text-align:right}
.pick:hover{border-color:var(--pri)}
.dims{font-size:22px;font-weight:700;direction:ltr;display:inline-block}
.citygrp{margin:14px 0 6px;font-weight:700;color:var(--mute)}
table.s{width:100%;border-collapse:collapse;font-size:14px}
table.s td,table.s th{padding:6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.s input:not([type=checkbox]){padding:6px 8px}
main.home{max-width:760px}
.hbtn[hidden]{display:none!important}
.hbtn{display:inline-flex!important;align-items:center;justify-content:center;gap:4px;min-width:40px;min-height:36px;padding:4px 10px!important}
.hello{font-size:15px;color:var(--mute);margin:4px 2px 12px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;min-height:112px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;font:inherit;text-align:right;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.tile:active{transform:scale(.98)}
.tile .ti{font-size:30px;line-height:1}
.tile .tl{font-size:17px;font-weight:700;color:var(--ink)}
.tile .ts{font-size:13px;color:var(--mute)}
.tile.has{border-color:#93c5fd;background:#f8fbff}
.tile.has .ts{color:var(--pri);font-weight:700}
.tile .tn{position:absolute;top:10px;left:10px;min-width:28px;height:28px;border-radius:14px;background:var(--bad);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.hint{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.55}
.menu-bg{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45)}
.menu{position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);background:#fff;z-index:61;padding:14px 10px calc(14px + env(safe-area-inset-bottom));overflow-y:auto;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
.menu .mh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .mh b{font-size:17px;color:var(--pri)}
.menu .mi{display:flex;width:100%;align-items:center;justify-content:space-between;padding:13px 12px;border:0;background:none;font:inherit;font-size:16px;border-radius:10px;cursor:pointer;text-align:right;color:var(--ink)}
.menu .mi.on{background:var(--pri2);color:var(--pri);font-weight:700}
.n{display:inline-block;min-width:20px;text-align:center;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:12px;font-weight:700}
.num.demo{background:#7c3aed}
.pill.sib{background:#ede9fe;color:#5b21b6;font-weight:600}
.siblink{color:#5b21b6;font-weight:700}
.sibs{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.ulist{display:grid;gap:8px}
.urow{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;grid-template-columns:minmax(190px,1.1fr) minmax(130px,1fr) 2.6fr;align-items:center}
.uhead{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.uemail{overflow-wrap:anywhere}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.rchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer;background:#fff}
.rchip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.rchip input{width:16px;height:16px}
.trow{display:grid;gap:8px;grid-template-columns:120px 140px 1fr auto;align-items:end;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){
  .tabs{display:none}
  .top{gap:6px;padding-inline:8px}
  .top .who{display:none}
  .top .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:16px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{min-height:104px;padding:12px}
  .bulk{top:56px}
  .urow{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr 1fr}
  .trow .tdesc{grid-column:1/-1}
}
.cityf{margin-bottom:8px}
.cityf select{font-weight:600;background:#fff}
.xcard{border:2px dashed #c4b5fd;background:#faf5ff}
.lrow{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.lrow.open{border-color:var(--pri);box-shadow:0 2px 10px rgba(29,78,216,.12)}
.lh{display:grid;grid-template-columns:56px minmax(220px,2.2fr) 110px 90px minmax(160px,2fr) 22px;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.lh:hover{background:#f8fafc}
.lh .ln{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh .chev{color:var(--mute);font-size:14px;transition:transform .15s}
.lrow.open .lh .chev{transform:rotate(180deg)}
.lbody{border-top:1px solid var(--line);padding:12px;background:#fcfdff}
.lbody .cols{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.more summary{cursor:pointer}
.hqrow{display:grid;grid-template-columns:56px minmax(240px,1.6fr) 190px minmax(200px,1.4fr);gap:10px;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.hqrow.has-k{border-inline-start:5px solid var(--ok)}
.hqrow.has-l{border-inline-start:5px solid var(--bad)}
.hqrow .seg button{min-height:40px;padding:6px}
.seg button.yes.on{background:var(--ok)}
.seg button.no.on{background:var(--bad)}
.showseg{display:inline-flex;margin-bottom:8px}
.showseg button{min-height:36px;padding:6px 12px;white-space:nowrap;flex:0 0 auto}
@media (max-width:760px){
  .lh{display:flex;flex-wrap:wrap;gap:4px 8px}
  .lh > .c-addr{flex:1 1 60%;min-width:0}
  .lh > .c-dims,.lh > .c-price{order:5}
  .lh > .c-note{order:6;flex:1 1 100%;white-space:normal}
  .lh > .chev{order:2}
  .lbody .cols{grid-template-columns:1fr}
  .hqrow{grid-template-columns:auto 1fr;gap:8px}
  .hqrow > .c-seg,.hqrow > .c-note{grid-column:1/-1}
}
.warn{background:var(--warn2);color:#78350f;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
</style>
<script src="logic.js"></script>
</head>

<div id="auth" class="auth" hidden>
  <div class="card">
    <h1>שלטים – דגל</h1>
    <div class="mute">מעקב תליית שלטים: הזנה, מדידה, אישור ותלייה</div>
    <div id="authBody"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <button class="hbtn" data-act="goHome" aria-label="עמוד הבית" title="עמוד הבית"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
    <span class="ttl" id="ttl">שלטים – דגל</span>
    <span class="who" id="who"></span>
    <span id="demoRole"></span>
    <button class="hbtn" id="gearBtn" data-act="goSettings" aria-label="הגדרות" title="הגדרות" hidden><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="hbtn" data-act="logout" aria-label="יציאה" title="יציאה">יציאה</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

// ───────── שכבת נתונים: Firebase ─────────
function FirebaseStore() {
  let db, auth, FV;
  const by = () => S.me ? S.me.name : '';
  return {
    async init() {
      const base = 'https://www.gstatic.com/firebasejs/9.23.0/';
      await loadScript(base + 'firebase-app-compat.js');
      await Promise.all(['firebase-firestore-compat.js', 'firebase-auth-compat.js'].map(f => loadScript(base + f)));
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore(); db.settings({ ignoreUndefinedProperties: true }); auth = firebase.auth(); FV = firebase.firestore.FieldValue;
    },
    onAuth(cb) { auth.onAuthStateChanged(u => cb(u ? { email: (u.email || '').toLowerCase(), displayName: u.displayName || '' } : null)); },
    async signIn() {
      const p = new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      try { await auth.signInWithPopup(p); }
      catch (e) {
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) return auth.signInWithRedirect(p);
        throw e;
      }
    },
    signOut() { return auth.signOut(); },
    subscribeConfig(cb, err) { return db.doc('signsMeta/config').onSnapshot(d => cb(d.exists ? d.data() : null), err); },
    subscribeSigns(cb, err) { return db.collection('signs').onSnapshot(q => { const m = {}; q.forEach(d => { m[d.id] = { ...d.data(), id: d.id }; }); cb(m); }, err); },
    updateSign(id, patch, o = {}) {
      const data = { ...patch, updatedAt: Date.now() };
      if (o.hist) data.history = FV.arrayUnion({ t: Date.now(), by: by(), a: o.hist });
      if (o.push) for (const [k, v] of Object.entries(o.push)) { const arr = [].concat(v); if (arr.length) data[k] = FV.arrayUnion(...arr); }
      return db.doc('signs/' + id).update(data);
    },
    removeFromArray(id, field, item, hist) {
      return db.doc('signs/' + id).update({ [field]: FV.arrayRemove(item), updatedAt: Date.now(), history: FV.arrayUnion({ t: Date.now(), by: by(), a: hist }) });
    },
    createSign(data, hist) {
      const cRef = db.doc('signsMeta/counter');
      const maxNum = Math.max(0, ...Object.values(S.signs).filter(s => !s.isDemo).map(s => s.num || 0));
      return db.runTransaction(async tx => {
        const c = await tx.get(cRef);
        const n = Math.max(c.exists ? (c.data().next || 1) : 1, maxNum + 1);
        const now = Date.now();
        tx.set(cRef, { next: n + 1 });
        tx.set(db.doc('signs/' + n), { ...data, num: n, createdAt: now, createdBy: by(), updatedAt: now, history: [{ t: now, by: by(), a: hist || 'נוצר' }] });
        return n;
      });
    },
    saveConfig(cfg) { return db.doc('signsMeta/config').set(cfg); },
    async importSigns(signs, nextNum) {
      for (let i = 0; i < signs.length; i += 400) {
        const b = db.batch();
        signs.slice(i, i + 400).forEach(s => b.set(db.doc('signs/' + s.num), s));
        await b.commit();
      }
      const cRef = db.doc('signsMeta/counter'); const c = await cRef.get();
      await cRef.set({ next: Math.max(c.exists ? (c.data().next || 1) : 1, nextNum) });
    },
    deleteSign(id) { return db.doc('signs/' + id).delete(); }
  };
}

    subscribeSigns(cb) { sSub = cb; emit(); return () => {}; },
    async updateSign(id, patch, o = {}) {
      const s = signs[id]; Object.assign(s, JSON.parse(JSON.stringify(patch)), { updatedAt: Date.now() });
      if (o.hist) s.history = [...(s.history || []), { t: Date.now(), by: by(), a: o.hist }];
      if (o.push) for (const [k, v] of Object.entries(o.push)) s[k] = [...(s[k] || []), ...[].concat(v)];
      emit();
    },
    async removeFromArray(id, field, item, hist) {
      const s = signs[id]; const j = JSON.stringify(item); s[field] = (s[field] || []).filter(x => JSON.stringify(x) !== j);
      s.history = [...(s.history || []), { t: Date.now(), by: by(), a: hist }]; emit();
    },
    async createSign(data, hist) {
      const n = Math.max(next, Math.max(0, ...Object.values(signs).filter(s => !s.isDemo).map(s => s.num)) + 1); next = n + 1;
      signs[n] = { ...JSON.parse(JSON.stringify(data)), num: n, id: String(n), createdAt: Date.now(), createdBy: by(), history: [{ t: Date.now(), by: by(), a: hist || 'נוצר' }] };
      emit(); return n;
    },
    async saveConfig(cfg) { config = JSON.parse(JSON.stringify(cfg)); setTimeout(() => cSub && cSub(JSON.parse(JSON.stringify(config))), 0); },
    async importSigns(arr, nextNum) { arr.forEach(s => { signs[s.num] = { ...s, id: String(s.num) }; }); next = Math.max(next, nextNum); emit(); },
    async deleteSign(id) { delete signs[id]; emit(); }
  };
}

// ───────── העלאת תמונות ─────────
async function compress(file, max = 1600, q = 0.82) {
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', q));
  } catch (e) { return file; }
}
async function uploadPhoto(file) {
  const blob = await compress(file);
  const meta = { t: Date.now(), by: S.me ? S.me.name : '' };
  if (DEMO) {
    const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
    return { url, src: 'demo', ...meta };
  }
  const fd = new FormData();
  fd.append('file', blob, 'sign.jpg');
  fd.append('upload_preset', CLOUDINARY.preset);
  fd.append('folder', CLOUDINARY.folder);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/image/upload`, { method: 'POST', body: fd });
  const d = await r.json();
  if (!d.secure_url) throw new Error((d.error && d.error.message) || 'העלאת התמונה נכשלה');
  return { url: d.secure_url, publicId: d.public_id, src: 'cloudinary', ...meta };
}
async function uploadFromUrl(url) {
  const fd = new FormData();
  fd.append('file', url);
  fd.append('upload_preset', CLOUDINARY.preset);
  fd.append('folder', CLOUDINARY.folder);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/image/upload`, { method: 'POST', body: fd });
  const d = await r.json();
  if (!d.secure_url) throw new Error((d.error && d.error.message) || 'העברה נכשלה');
  return { url: d.secure_url, publicId: d.public_id, src: 'cloudinary' };
}
async function uploadMany(files, onStart, onDone) {
  const out = [];
  onStart(files.length);
  for (const f of files) {
    try { out.push(await uploadPhoto(f)); } catch (e) { fail(e); }
    onDone();
  }
  return out;
}

const RULES_SNIPPET = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null && request.auth.token.email is string; }
    function email() { return request.auth.token.email.lower(); }
    function cfg() { return get(/databases/$(database)/documents/signsMeta/config).data; }
    function isSuper() { return signedIn() && email() == '${SUPER}'; }
    function isUser() {
      return isSuper() || (signedIn()
        && exists(/databases/$(database)/documents/signsMeta/config)
        && email() in cfg().userEmails);
    }
    function isAdmin() { return isSuper() || (isUser() && 'admin' in cfg().users[email()].roles); }
    match /signs/{id} { allow read, write: if isUser(); }
    match /signsMeta/counter { allow read, write: if isUser(); }
    match /signsMeta/config { allow read: if isUser(); allow write: if isAdmin(); }
  }
}`;

// ═════════ הזנה (בלאט) ═════════
function addrForm(prefix, f, stateKey) {
  const field = (k, label, req, extra = '') => `<div><label class="f">${label}${req ? ' <b>*</b>' : ''}</label><input id="${prefix}-${k}" value="${esc(f[k])}" data-inp="form" data-s="${stateKey}" data-k="${k}" ${extra}></div>`;
  return `<datalist id="dl-cities">${cities().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
  <div class="row2">
    ${field('city', 'עיר', true, 'list="dl-cities" autocomplete="off"')}
    ${field('street', 'רחוב', true, 'autocomplete="off"')}
    ${field('houseNo', 'מספר', false, 'inputmode="numeric" autocomplete="off"')}
    ${field('floor', 'קומה', false, 'autocomplete="off"')}
    ${field('name', 'שם', false, 'autocomplete="off"')}
    ${field('phone', 'טלפון', true, 'inputmode="tel" autocomplete="off"')}
  </div>
  <div style="margin-top:8px">${field('note', 'הערת מיקום (לא חובה)', false, 'placeholder="למשל: פינת…, מול הפארק" autocomplete="off"')}</div>`;
}
function validateAddr(f) {
  const miss = [['city', 'עיר'], ['street', 'רחוב'], ['phone', 'טלפון']].filter(([k]) => !String(f[k] || '').trim()).map(x => x[1]);
  if (miss.length) { toast('חסר: ' + miss.join(', '), true); return false; }
  const ph = L.phones(f.phone);
  if (!ph.length || !ph.every(L.phoneLooksValid)) { if (!confirm('מספר הטלפון נראה לא תקין. לשמור בכל זאת?')) return false; }
  const dup = list().filter(s => norm(s.city) === norm(f.city) && norm(s.street) === norm(f.street) && norm(s.houseNo) === norm(f.houseNo));
  if (dup.length && !confirm(`כבר קיים שלט בכתובת הזו (מס' ${dup.map(s => s.num).join(', ')}).\nלהוסיף בכל זאת שלט נוסף?`)) return false;
  return true;
}
const trimAddr = f => Object.fromEntries(Object.entries(f).map(([k, v]) => [k, String(v || '').trim()]));

VIEWS.entry = function () {
  const f = ui.entry.form;
  // רק מה שהמשתמש עצמו הוסיף היום — לאישור ולתיקון מהיר
  const since = Date.now() - 864e5;
  const recent = list().filter(s => !s.isDemo && s.createdBy === S.me.name && (s.createdAt || 0) > since)
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 5);
  return `<div class="card"><h2>הוספת כתובת חדשה</h2>${addrForm('e', f, 'entry')}
    <div style="margin-top:12px"><button class="btn pri big" data-act="entrySave" ${ui.entry.saving ? 'disabled' : ''}>${ui.entry.saving ? 'שומר…' : '＋ הוסף כתובת'}</button></div></div>
  ${recent.length ? `<h3 style="margin-top:14px">הוספת היום <span class="mute small">– לחיצה פותחת לתיקון</span></h3>
  ${recent.map(s => `<button class="pick" data-act="open" data-id="${s.id}">${numTag(s)}<span class="sp"><span class="addr">${esc(s.city)} · ${esc(addrOf(s))}</span> <span class="mute small">${esc(s.name)} · ${fmtT(s.createdAt)}</span></span></button>`).join('')}` : ''}`;
};

VIEWS.hq = function () {
  const h = ui.hq;
  const active = list().filter(s => !s.rejected && !s.finished && !s.done);
  const inCity = active.filter(s => !h.city || s.city === h.city);
  const open = inCity.filter(s => !s.hqRec), marked = inCity.filter(s => s.hqRec);

      <span>${numTag(s)}</span>

      <input class="c-note" id="hqn-${s.id}" placeholder="הערת מטה" value="${esc(s.hqNote)}" data-chg="sf" data-f="hqNote" data-id="${s.id}">

VIEWS.plan = function () {
  const p = ui.plan;
  const base = list().filter(s => st(s) === 'await_survey');
  const lastOf = s => (s.contactLog || []).slice().sort((a, b) => b.t - a.t)[0];
  const rank = s => { const l = lastOf(s); return !l ? 1 : l.type === 'תואם' ? 0 : l.type === 'סירב' ? 3 : 2; };
  const rows = base.filter(s => (!p.city || s.city === p.city) && matchQ(s, p.q))
    .sort((a, b) => a.city.localeCompare(b.city, 'he') || rank(a) - rank(b) || a.num - b.num);
  return `<h2>מחכים למדידה <span class="mute small">(${base.length})</span></h2>
  ${cityChips(base, p.city, 'plan.city')}
  <div class="toolbar"><input id="p-q" type="search" placeholder="חיפוש כתובת / שם" value="${esc(p.q)}" data-inp="setv" data-k="plan.q"></div>
  ${rows.length ? `<div class="grid">${rows.map(s => {
    const log = (s.contactLog || []).slice().sort((a, b) => b.t - a.t), l = log[0];
    return `<div class="card">
      <div class="flex">${numTag(s)}<span class="addr sp">${esc(s.city)} · ${esc(addrOf(s))}${sibTag(s)}</span></div>
      <div class="small">${esc(s.name) || '<span class="mute">ללא שם</span>'}${s.note ? ` <span class="mute">· ${esc(s.note)}</span>` : ''}</div>
      ${s.hqNote ? `<div class="small mute">מטה: ${esc(s.hqNote)}</div>` : ''}
      <div style="margin-top:6px">${phoneLinks(s)}</div>
      ${l ? `<div class="lastlog">אחרון: <b>${esc(l.type)}</b>${l.note ? ' – ' + esc(l.note) : ''} <span class="mute small">· ${fmtT(l.t)}</span></div>` : ''}
      <div style="margin-top:8px"><input id="ln-${s.id}" placeholder="הערה לשיחה (לא חובה)"></div>
      <div class="flex" style="margin-top:6px">${CONTACT_TYPES.map(t => `<button class="btn sm" data-act="log" data-type="${t}" data-id="${s.id}">${t}</button>`).join('')}<button class="btn sm" data-act="log" data-type="הערה" data-id="${s.id}">רשום הערה</button></div>
      ${log.length > 1 ? `<details style="margin-top:6px"><summary class="small mute">כל השיחות (${log.length})</summary><ul class="log">${log.map(x => `<li><b>${esc(x.type)}</b>${x.note ? ' – ' + esc(x.note) : ''} <span class="t">· ${fmtT(x.t)}</span></li>`).join('')}</ul></details>` : ''}

  }).join('')}</div>` : emptyBox('✓', base.length ? 'אין תוצאות לסינון' : 'אין שלטים שמחכים למדידה')}`;
};

VIEWS.measure = function () {
  const m = ui.measure;
  const back = `<button class="btn" data-act="mReset">→ חזרה לרשימה</button>`;
  // רשימת השלטים למדידה
  if (m.mode === 'list' && !m.signId) {
    const base = list().filter(s => !s.rejected && !s.done && !s.finished && !s.yossiDecision && (m.includeMeasured || !L.isMeasured(s)));
    const rows = base.filter(s => (!m.city || s.city === m.city) && matchQ(s, m.q))
      .sort((a, b) => (b.approved1 ? 1 : 0) - (a.approved1 ? 1 : 0) || a.city.localeCompare(b.city, 'he') || a.num - b.num);
    return `${cityChips(base, m.city, 'measure.city')}
      <div class="toolbar"><input id="ms-q" type="search" placeholder="חיפוש כתובת / שם / מספר" value="${esc(m.q)}" data-inp="setv" data-k="measure.q">
      <label class="flex small"><input type="checkbox" data-act="setb" data-k="measure.includeMeasured" ${m.includeMeasured ? 'checked' : ''}> כולל שכבר נמדדו</label></div>
      ${rows.slice(0, 150).map(s => `<button class="pick" data-act="mPick" data-id="${s.id}">${numTag(s)}<span class="sp"><span class="addr">${esc(s.city)} · ${esc(addrOf(s))}</span> <span class="mute small">${esc(s.name)}</span>${sibTag(s, false)}
        ${!s.approved1 ? ' <span class="pill">טרם אושר</span>' : ''}${L.isMeasured(s) ? ' <span class="pill">נמדד</span>' : ''}</span></button>`).join('') || emptyBox('🔍', 'לא נמצאו שלטים')}
      <div class="mute small" style="text-align:center;margin:14px 0">כתובת שלא ברשימה? <a href="#" data-act="mNew">＋ הוסף כתובת חדשה מהשטח</a></div>`;
  }
  // טופס מדידה
  const s = m.signId ? S.signs[m.signId] : null, b = m.baseId ? S.signs[m.baseId] : null, t = s || b;
  if (m.mode !== 'new' && !t) { ui.measure = { ...blankMeasure(), city: m.city, q: m.q }; return VIEWS.measure(); }

    : `<div class="card"><div class="flex">${numTag(t)}<span class="addr sp">${esc(t.city)} · ${esc(addrOf(t))}${sibTag(t)}</span>${m.mode === 'extra' ? '<span class="pill">שלט נוסף</span>' : ''}</div>

       ${s && s.photos && s.photos.length ? `<div class="mute small" style="margin-top:6px">תמונות קיימות:</div>${photoStrip(s.photos)}` : ''}</div>`;
  const extras = m.extras.map((x, i) => `<div class="card xcard">
      <div class="flex"><b class="sp">➕ שלט נוסף בכתובת הזו${m.extras.length > 1 ? ` (${i + 1})` : ''}</b><button class="btn sm bad" data-act="mxDel" data-i="${i}">הסר</button></div>

      ${x.same ? `<div class="mute small" style="margin-top:6px">יישמר באותן מידות: גובה ${esc(m.height || '?')} · רוחב ${esc(m.width || '?')}</div>`

      'החלטת יוסי', 'גובה לביצוע', 'רוחב לביצוע', 'מחיר לפני מע"מ', 'מחיר כולל מע"מ', 'לביצוע', 'חזר מהדפוס', 'מנוף תואם', 'בוצע', 'הסתיים', 'סטטוס', 'יומן שיחות', 'תמונות', 'תמונות ביצוע'];
    const yn = v => v ? 'כן' : '';
    const data = rows.map(s => {
      const d = L.execDims(s), p = priceOf(s);
      return [s.num, s.city, s.street, s.houseNo, s.floor, s.note, s.name, s.phone, s.hqRec, s.hqNote, yn(s.approved1),
        L.num(s.height) || '', L.num(s.width) || '', s.access, s.surveyNote,
        s.yossiDecision === 'approved' ? 'אושר' : s.yossiDecision === 'rejected' ? 'לא אושר' : '', d.h || '', d.w || '',
        p && !p.special ? p.net : '', p && !p.special ? p.gross : (p ? 'מחיר מיוחד' : ''),
        yn(s.toExecute), yn(s.printReturned), fmtDay(s.craneDate), yn(s.done), yn(s.finished), L.STATUS_MAP[st(s)].label,
        (s.contactLog || []).map(l => `${fmtT(l.t)} ${l.type}${l.note ? ' - ' + l.note : ''}`).join(' | '),
        (s.photos || []).map(x => x.url).join(' '), (s.donePhotos || []).map(x => x.url).join(' ')];
    });
    const ws = XLSX.utils.aoa_to_sheet([head, ...data]);
    ws['!cols'] = head.map((h, i) => ({ wch: [6, 12, 18, 6, 8, 22, 18, 22][i] || 12 }));
    head.forEach((h, i) => { const c = ws[XLSX.utils.encode_cell({ r: 0, c: i })]; if (c) c.s = { font: { bold: true }, fill: { fgColor: { rgb: 'DBEAFE' } } }; });
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.utils.book_append_sheet(wb, ws, 'שלטים');
    XLSX.writeFile(wb, `${name}-${new Date().toISOString().slice(0, 10)}.xlsx`);
  } catch (e) { fail(e); }
}

    if (!m.access) { toast('יש לבחור גישה: קלה או מנוף', true); return; }
    const extras = m.extras.map(x => x.same ? { h, w, note: x.note.trim() } : { h: parseM(x.height), w: parseM(x.width), note: x.note.trim() });
    if (extras.some(x => !okDim(x.h) || !okDim(x.w))) { toast('בשלט הנוסף: יש להזין גובה ורוחב, או לבחור "מידות זהות"', true); return; }
    let addr = null;

    if (!m.photos.length && !confirm('לא צורפה תמונה. לשמור בלי תמונה?')) return;
    const meas = (hh, ww, note) => ({ height: hh, width: ww, access: m.access, surveyNote: note, surveyBy: S.me.name, surveyAt: Date.now() });
    const histTxt = (hh, ww) => `נמדד: ${fmtM(hh)}×${fmtM(ww)}, גישה ${m.access}${m.photos.length ? `, ${m.photos.length} תמונות` : ''}`;

      toast(nums.length > 1 ? `נשמרו ${nums.length} שלטים: ${nums.join(', ')}` : `המדידה נשמרה (שלט ${n})`);

  suAdd: () => {
    const lines = ($('#su-new').value || '').split(/\n+/).map(x => x.trim()).filter(Boolean);

      const m = line.match(/[^\s,;<>]+@[^\s,;<>]+\.[^\s,;<>]+/);

    const tiers = d.pricing.tiers.map(t => ({ max: parseM(t.max), price: parseM(t.price), desc: String(t.desc || '').trim() })).filter(t => t.max > 0).sort((a, b) => a.max - b.max);
    if (!tiers.length) { toast('המחירון ריק', true); return; }
    try {
      // רק משתמש עם תפקיד מקבל גישה לנתונים (כללי Firestore בודקים את userEmails)
      const userEmails = Object.keys(users).filter(e => e === SUPER || (users[e].roles || []).length);
      const cfg = { ...S.config, users, userEmails, pricing: { vat: parseM(d.pricing.vat), tiers } };
      await Store.saveConfig(cfg);

      ui.settings = null; toast('ההגדרות נשמרו'); render();

  importCancel: () => { ui.importPreview = null; render(); },
  migrateDrive: async () => {
    const todo = list().filter(x => [...(x.photos || []), ...(x.donePhotos || [])].some(ph => ph.src === 'drive'));
    const total = todo.reduce((a, x) => a + [...(x.photos || []), ...(x.donePhotos || [])].filter(ph => ph.src === 'drive').length, 0);
    let done = 0, ok = 0, bad = 0;
    ui.migrating = `0/${total}`; render();
    const moveArr = async arr => {
      const out = [];
      for (const ph of arr || []) {
        if (ph.src !== 'drive') { out.push(ph); continue; }
        try {
          const up = DEMO ? { url: ph.url, src: 'demo' } : await uploadFromUrl(`https://drive.google.com/uc?export=download&id=${encodeURIComponent(ph.driveId)}`);
          out.push({ ...up, t: ph.t || Date.now(), by: ph.by || '', fromDrive: ph.driveId }); ok++;
        } catch (e) { out.push(ph); bad++; console.warn('drive photo', ph.driveId, e); }
        done++; ui.migrating = `${done}/${total}`; render();
      }
      return out;
    };
    for (const x of todo) {
      const photos = await moveArr(x.photos), donePhotos = await moveArr(x.donePhotos);
      try { await Store.updateSign(x.id, { photos, donePhotos }, { hist: 'תמונות הועברו מגוגל דרייב לתוכנה' }); } catch (e) { fail(e); }
    }
    ui.migrating = '';
    ui.migrateResult = { ok, bad, t: Date.now() };
    render();
  },

  importRun: async () => {
    const ip = ui.importPreview;
    if (!confirm(`לייבא ${ip.add.length} שלטים?`)) return;
    try { await Store.importSigns(ip.add, ip.nextNum); toast(`יובאו ${ip.add.length} שלטים`); ui.importPreview = null; render(); } catch (e) { fail(e); }
  }
};

const CHANGES = {
  setv: el => { setPath(el.dataset.k, el.value); render(); },
  demoRole: el => { S.me.demoRoles = [el.value]; S.me.roles = [el.value]; ui.tab = null; render(); },
  sf: el => {
    const s = S.signs[el.dataset.id], f = el.dataset.f;
    let v = el.value.trim();
    if (['height', 'width'].includes(f)) v = parseM(v);
    if (String(s[f] ?? '') === String(v)) return;
    if (['city', 'street', 'phone'].includes(f) && !v) { toast(`${FIELD_LABELS[f]} הוא שדה חובה`, true); el.value = s[f] || ''; return; }
    upd(s.id, { [f]: v }, { hist: `${FIELD_LABELS[f] || f}: ${valStr(s[f])} → ${valStr(v)}` });
  },
  ydim: el => {
    const s = S.signs[el.dataset.id], h = parseM(($('#yh-' + s.id) || {}).value), w = parseM(($('#yw-' + s.id) || {}).value);
    upd(s.id, { execHeight: h, execWidth: w });
  },
  photos: async el => {
    const files = [...el.files]; el.value = '';
    if (!files.length) return;
    const t = el.dataset.target, id = el.dataset.id;
    if (t === 'measure') {
      const m = ui.measure;
      const got = await uploadMany(files, n => { m.uploading += n; render(); }, () => { m.uploading--; });
      if (ui.measure === m) { m.photos.push(...got); }
      render();
    } else if (t === 'hang') {
      const f = ui.hang.form[id];
      const got = await uploadMany(files, n => { f.uploading += n; render(); }, () => { f.uploading--; });
      f.photos.push(...got); render();
    } else if (t === 'modal-photos' || t === 'modal-done') {
      const got = await uploadMany(files, n => { ui.modalUp = (ui.modalUp || 0) + n; render(); }, () => { ui.modalUp--; });
      ui.modalUp = 0;
      if (got.length) await upd(id, {}, { hist: `נוספו ${got.length} ${t === 'modal-done' ? 'תמונות ביצוע' : 'תמונות'}`, push: { [t === 'modal-done' ? 'donePhotos' : 'photos']: got } });
      render();
    }
  },
  importFile: async el => {
    const file = el.files[0]; el.value = '';
    if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      if (j.kind !== 'signs-import' || !Array.isArray(j.signs)) throw new Error('הקובץ אינו קובץ ייבוא שלטים');
      const clean = j.signs.filter(s => s && Number.isInteger(s.num) && s.num > 0).map(s => { const o = { ...blankSign(), ...s }; delete o.id; return o; });
      const skip = clean.filter(s => S.signs[String(s.num)]).map(s => s.num);
      ui.importPreview = { signs: clean, add: clean.filter(s => !S.signs[String(s.num)]), skip, nextNum: Math.max(j.nextNum || 1, ...clean.map(s => s.num + 1)) };
      render();
    } catch (e) { fail(e); }
  }
};

const INPUTS = {
  setv: el => { setPath(el.dataset.k, el.value); if (['manage.q', 'plan.q', 'measure.q'].includes(el.dataset.k) || (ui.measure.extras.length && ['measure.height', 'measure.width'].includes(el.dataset.k))) render(); },
  mx: el => { ui.measure.extras[+el.dataset.i][el.dataset.k] = el.value; },
  form: el => { const tgt = el.dataset.s === 'entry' ? ui.entry.form : ui.measure.addr; tgt[el.dataset.k] = el.value; },
  ydim: el => { const s = S.signs[el.dataset.id]; const box = document.getElementById('yp-' + s.id); if (box) box.innerHTML = yossiPriceBox({ ...s, yossiMode: 'change' }); },
  hangNote: el => { ui.hang.form[el.dataset.id].note = el.value; },
  suName: el => { ui.settings.users[el.dataset.email].name = el.value; },
  tier: el => { ui.settings.pricing.tiers[+el.dataset.i][el.dataset.k] = el.value; },
  vat: el => { ui.settings.pricing.vat = parseM(el.value) / 100; }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, ev);
});
document.addEventListener('change', ev => { const el = ev.target.closest('[data-chg]'); if (el && CHANGES[el.dataset.chg]) CHANGES[el.dataset.chg](el, ev); });
document.addEventListener('input', ev => { const el = ev.target.closest('[data-inp]'); if (el && INPUTS[el.dataset.inp]) INPUTS[el.dataset.inp](el, ev); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.modal) { ui.modal = ''; render(); } });
// מעבר בין מסכים + כפתור "חזור" של הטלפון
function go(tab, fromHistory) {
  if (ui.tab === 'settings' && tab !== 'settings') ui.importPreview = null;
  ui.tab = tab; ui.modal = '';
  if (!fromHistory) try { history.pushState({ tab }, '', '#' + tab); } catch (e) {}
  window.scrollTo(0, 0); render();
}
window.addEventListener('popstate', ev => {
  if (ui.modal) { ui.modal = ''; render(); return; }
  const m = ui.measure;
  if (ui.tab === 'measure' && (m.signId || m.baseId || m.mode === 'new') && !(ev.state && ev.state.sub)) {
    if (!measureLeaveOk()) { pushSub(); return; }
    measureToList(true); return;
  }
  go((ev.state && ev.state.tab) || 'home', true);
});
try { history.replaceState({ tab: 'home' }, '', location.pathname + location.search); } catch (e) {}

// ───────── הפעלה ─────────
(async function boot() {
  try { await Store.init(); }
  catch (e) { showAuth('לא ניתן להתחבר לשרת: ' + esc(e.message) + '<br>בדוק חיבור לאינטרנט ורענן.'); return; }
  Store.onAuth(u => {
    stopSubs(); S.signsSub = false; S.user = u;
    if (!u) { showAuth(); return; }
    $('#auth').hidden = false; $('#authBody').innerHTML = '<div class="mute" style="margin-top:14px">⏳ מתחבר…</div>';
    S.unsub.push(Store.subscribeConfig(onConfig, onDataError));
  });
})();
</script>
</body>
</html>
